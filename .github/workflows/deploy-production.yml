name: Deploy to TestFlight (Production)

on:
  push:
    branches:
      - main

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write App Store Connect API key
        run: echo "${{ secrets.ASC_API_KEY }}" > AuthKey.p8

      - name: Build and auto-submit to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform ios --profile production --non-interactive --auto-submit
