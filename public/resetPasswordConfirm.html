<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tremane パスワード再設定</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background-color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
    }
    .card {
      max-width: 400px;
      width: 100%;
      margin-top: 80px;
      background-color: #ffffff;
      border-radius: 12px;
      padding: 32px 24px;
      text-align: center;
    }
    h1 {
      font-size: 16px;
      color: #333333;
      margin: 0 0 16px;
    }
    p {
      font-size: 14px;
      color: #333333;
      line-height: 1.8;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Tremane</h1>
    <p>
      Tremaneアプリがこの端末にインストールされていないため、ページを表示しています。<br>
      App StoreからTremaneアプリをインストールした上で、再度メール内のリンクを開いてください。
    </p>
  </div>
</body>
</html>
